<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Questions philosophiques</title>
<meta name="description" content="Choisis un thème, ouvre un dossier et écris librement ta réponse à une question philosophique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--noir:#000;--carte:#0a0a0a;--ligne:#1f1f1f;--txt:#f4f4f4;--mut:#9a9a9a;--acc:#b8a6ff;--acc2:#7c5cff;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#000}
body{margin:0;background:var(--noir);color:var(--txt);font:400 1.05rem/1.7 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit}
::selection{background:var(--acc2);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

/* Lueur d'ambiance : elle s'intensifie quand on écrit */
.lueur{position:fixed;inset:0;z-index:0;pointer-events:none;--e:0;transition:.8s;
background:radial-gradient(70rem 34rem at 50% -10%,rgba(124,92,255,calc(.16 + var(--e)*.22)),transparent 62%),
radial-gradient(44rem 26rem at 95% 110%,rgba(34,211,238,calc(.04 + var(--e)*.1)),transparent 60%)}

/* Menu en haut à gauche */
.btn-menu{position:fixed;top:1rem;left:1rem;z-index:40;display:flex;align-items:center;gap:.6rem;height:44px;
background:rgba(10,10,10,.85);backdrop-filter:blur(10px);color:var(--txt);border:1px solid #2e2e2e;border-radius:12px;padding:0 1rem;
font:600 .95rem var(--sans);cursor:pointer;transition:.25s}
.btn-menu:hover{border-color:var(--acc);box-shadow:0 0 26px -6px var(--acc)}
.btn-menu .barres{display:grid;gap:4px}
.btn-menu .barres i{display:block;width:18px;height:2px;background:currentColor;border-radius:2px}

.voile{position:fixed;inset:0;background:rgba(0,0,0,.72);opacity:0;visibility:hidden;transition:.3s;z-index:45}
.tiroir{position:fixed;top:0;left:0;bottom:0;width:min(23rem,88vw);background:#040404;border-right:1px solid var(--ligne);
transform:translateX(-100%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility .35s;z-index:50;overflow-y:auto;padding:1.2rem 1.2rem 3rem}
.ouvert .tiroir{transform:none;visibility:visible}
.ouvert .voile{opacity:1;visibility:visible}
.tiroir-haut{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.4rem}
.tiroir-haut strong{font:600 1.6rem var(--serif)}
.fermer{background:none;border:1px solid #2e2e2e;color:var(--txt);border-radius:10px;width:38px;height:38px;font-size:1.1rem;cursor:pointer}
.tiroir a.accueil{display:block;padding:.7rem .8rem;border-radius:10px;text-decoration:none;color:var(--mut);margin-bottom:.4rem}
.tiroir a.accueil:hover{color:var(--txt);background:#111}
.tiroir details{border-top:1px solid var(--ligne);padding:.3rem 0}
.tiroir summary{cursor:pointer;list-style:none;padding:.8rem;font:600 1.3rem var(--serif);display:flex;justify-content:space-between;gap:1rem}
.tiroir summary::-webkit-details-marker{display:none}
.tiroir summary::after{content:"+";color:var(--acc);font-family:var(--sans)}
.tiroir details[open] summary::after{content:"−"}
.tiroir details a{display:block;margin:.15rem 0 .15rem .8rem;padding:.55rem .9rem;border-left:2px solid #262626;color:var(--mut);text-decoration:none;font-size:.97rem;transition:.2s}
.tiroir details a:hover{color:var(--txt);border-left-color:var(--acc);background:#0c0c0c}

/* Scène */
main{position:relative;z-index:1;max-width:62rem;margin:0 auto;padding:5.8rem 1.4rem 5rem}
.fil{font-size:.9rem;color:var(--mut);margin-bottom:1.8rem}
.fil a{color:var(--mut);text-decoration:none}
.fil a:hover{color:var(--txt)}
.fil span{margin:0 .4rem;opacity:.45}
h1{font:600 clamp(2.6rem,8vw,5.2rem)/1 var(--serif);margin:0 0 1.2rem;letter-spacing:-.015em}
h1 em{font-style:italic;color:var(--acc);font-weight:500}
h1.q{font-size:clamp(2rem,5.4vw,3.3rem);line-height:1.12;max-width:44rem}
.intro{color:var(--mut);max-width:38rem;margin:0 0 2.4rem;font-size:1.15rem}
.etiquette{display:inline-block;font:500 .78rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:1rem}
.vue{animation:entree .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes entree{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Question du jour */
.jour{position:relative;max-width:46rem;margin:0 0 3.2rem;padding:1.6rem 1.7rem 1.7rem;border-radius:20px;border:1px solid rgba(184,166,255,.32);
background:radial-gradient(28rem 12rem at 0% 0%,rgba(124,92,255,.2),transparent 70%),#050505}
.jour .etiquette{margin-bottom:.6rem}
.jour p{font:500 clamp(1.5rem,3.6vw,2.1rem)/1.25 var(--serif);margin:0 0 1.2rem}
.cta{display:inline-flex;align-items:center;gap:.5rem;background:var(--txt);color:#000;border-radius:12px;padding:.75rem 1.3rem;text-decoration:none;font:600 .95rem var(--sans);transition:.25s}
.cta:hover{background:var(--acc);transform:translateY(-2px)}
.titre-section{font:600 1.7rem var(--serif);margin:0 0 1.4rem}

/* Dossiers */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1.9rem 1.4rem}
.dossier{position:relative;display:block;margin-top:14px;padding:1.5rem 1.4rem 1.4rem;background:var(--carte);
border:1px solid var(--ligne);border-radius:0 16px 16px 16px;text-decoration:none;color:inherit;transition:.3s;overflow:visible}
.dossier::before{content:"";position:absolute;top:-14px;left:-1px;width:84px;height:14px;background:var(--carte);
border:1px solid var(--ligne);border-bottom:0;border-radius:10px 10px 0 0;transition:.3s}
.dossier::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:.3s;
background:radial-gradient(16rem circle at var(--mx,50%) var(--my,0%),rgba(184,166,255,.15),transparent 62%)}
.dossier:hover{transform:translateY(-4px);border-color:rgba(184,166,255,.7);box-shadow:0 22px 50px -22px var(--acc2)}
.dossier:hover::before{border-color:rgba(184,166,255,.7)}
.dossier:hover::after{opacity:1}
.dossier .num{font:600 .8rem var(--sans);color:var(--acc);letter-spacing:.12em}
.dossier h3{font:600 1.6rem/1.2 var(--serif);margin:.4rem 0 .5rem}
.dossier p{margin:0;color:var(--mut);font-size:.97rem}
.dossier .compte{display:block;margin-top:1rem;font-size:.85rem;color:#707070}

/* Liste de questions */
.questions{list-style:none;margin:0;padding:0;max-width:46rem}
.questions a{display:flex;gap:1.1rem;align-items:baseline;padding:1.2rem .4rem;border-top:1px solid var(--ligne);text-decoration:none;transition:.25s}
.questions li:last-child a{border-bottom:1px solid var(--ligne)}
.questions a:hover{padding-left:1rem;background:#070707;color:var(--acc)}
.questions .n{font:600 1.05rem var(--serif);color:var(--acc);min-width:1.6rem}
.questions .t{font:500 1.3rem/1.4 var(--serif);flex:1}
.questions .ok{font-size:.8rem;color:#7ee2a8;white-space:nowrap}

/* Espace d'écriture */
form{max-width:46rem}
.feuille{margin-top:1.8rem;background:#050505;border:1px solid #242424;border-radius:20px;transition:.3s}
.feuille:focus-within{border-color:rgba(184,166,255,.75);box-shadow:0 0 0 4px rgba(184,166,255,.1),0 40px 90px -40px rgba(124,92,255,.6)}
.feuille textarea{display:block;width:100%;min-height:min(58vh,26rem);background:transparent;color:var(--txt);border:0;resize:vertical;
padding:1.7rem 1.7rem 1rem;font:400 clamp(1.15rem,2.6vw,1.4rem)/1.85 var(--serif);caret-color:var(--acc)}
.feuille textarea:focus{outline:none}
.feuille textarea::placeholder{color:#555;font-style:italic}
.pied-feuille{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 1.4rem;border-top:1px solid #161616;font-size:.82rem;color:#6d6d6d}
.amorces{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:1.1rem 0 0;font-size:.88rem;color:var(--mut)}
.amorce{background:transparent;color:var(--mut);border:1px solid #2a2a2a;border-radius:999px;padding:.35rem .85rem;font:500 .85rem var(--sans);cursor:pointer;transition:.2s}
.amorce:hover{color:var(--txt);border-color:var(--acc)}
.signe{margin:1.5rem 0 0}
.signe summary{cursor:pointer;color:var(--mut);font-size:.92rem;width:max-content}
.signe summary:hover{color:var(--txt)}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
label{display:block;font:600 .82rem var(--sans);margin:0 0 .4rem;color:var(--mut)}
input[type=text],input[type=email]{width:100%;background:#060606;color:var(--txt);border:1px solid #262626;border-radius:12px;padding:.8rem 1rem;font:400 1rem var(--sans);transition:.2s}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(184,166,255,.16)}
.piege{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.envoyer{margin-top:1.8rem;display:inline-flex;align-items:center;gap:.6rem;background:var(--txt);color:#000;border:0;border-radius:14px;
padding:1rem 1.9rem;font:600 1rem var(--sans);cursor:pointer;transition:.25s}
.envoyer:hover{background:var(--acc);transform:translateY(-2px)}
.envoyer:disabled{opacity:.5;cursor:wait;transform:none}
.etat{min-height:1.6rem;margin:1rem 0 0;font-size:.98rem}
.etat.ok{color:#7ee2a8}.etat.err{color:#ff8a8a}
.note{margin-top:1.4rem;font-size:.85rem;color:#6d6d6d}
.suite{display:flex;flex-wrap:wrap;gap:1.4rem;margin-top:2rem;font-size:.95rem}
.suite a{color:var(--acc);text-decoration:none}
.suite a:hover{text-decoration:underline}

@media(max-width:640px){.deux{grid-template-columns:1fr}.btn-menu span.mot{display:none}.btn-menu{padding:0 .9rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="lueur" id="lueur" aria-hidden="true"></div>

<button class="btn-menu" id="btnMenu" aria-expanded="false" aria-controls="tiroir">
  <span class="barres" aria-hidden="true"><i></i><i></i><i></i></span><span class="mot">Menu</span>
</button>
<div class="voile" id="voile"></div>
<aside class="tiroir" id="tiroir" aria-label="Thèmes philosophiques">
  <div class="tiroir-haut"><strong>Thèmes</strong><button class="fermer" id="fermer" aria-label="Fermer le menu">✕</button></div>
  <a class="accueil" href="#">← Accueil</a>
  <nav id="navThemes"></nav>
</aside>

<main id="scene"></main>

<script>
(function(){
  /* ADRESSE QUI REÇOIT LES RÉPONSES */
  var ENDPOINT = "https://formsubmit.co/ajax/tabomar2007@gmail.com";

  var T = [
    {n:"La conscience", d:"Ce que signifie sentir, penser et être soi.", s:[
      {n:"L’esprit et le corps", q:[
        "Mon esprit est-il identique à mon cerveau ?",
        "Un robot pourrait-il un jour être vraiment conscient ?",
        "Pourquoi ressentons-nous des émotions plutôt que de simplement réagir ?",
        "Les animaux ont-ils une conscience comparable à la nôtre ?",
        "Que se passe-t-il dans notre conscience quand nous dormons ou rêvons ?"]},
      {n:"Le moi et l’identité", q:[
        "Suis-je la même personne qu’il y a dix ans ?",
        "Qu’est-ce qui fait de moi quelqu’un d’unique ?",
        "Le regard des autres façonne-t-il qui je suis ?",
        "Peut-on se connaître vraiment soi-même ?",
        "Si je perdais tous mes souvenirs, serais-je encore moi ?"]}]},
    {n:"L’existence", d:"Le sens de la vie, la mort et le temps qui passe.", s:[
      {n:"Le sens de la vie", q:[
        "La vie a-t-elle un sens, ou devons-nous le créer ?",
        "Le bonheur est-il le but de l’existence ?",
        "Faut-il souffrir pour grandir ?",
        "Qu’est-ce qui donne de la valeur à une vie ?",
        "Vaut-il mieux vivre intensément ou vivre longtemps ?"]},
      {n:"La mort et le temps", q:[
        "Faut-il avoir peur de la mort ?",
        "La mort donne-t-elle un sens à la vie ?",
        "Le temps existe-t-il vraiment, ou n’est-il qu’une impression de notre esprit ?",
        "Que reste-t-il de nous quand nous disparaissons ?",
        "Vivrions-nous mieux si nous étions immortels ?"]}]},
    {n:"La liberté et la morale", d:"Nos choix, nos responsabilités, le bien et le mal.", s:[
      {n:"Le libre arbitre", q:[
        "Sommes-nous vraiment libres de nos choix ?",
        "Peut-on être responsable de ce que l’on n’a pas choisi d’être ?",
        "Être libre, est-ce faire tout ce que l’on veut ?",
        "Notre éducation décide-t-elle de nos choix à notre place ?",
        "Un monde où tout serait prévisible serait-il un monde sans liberté ?"]},
      {n:"Le bien et le mal", q:[
        "Le bien et le mal existent-ils indépendamment des cultures ?",
        "Le mensonge est-il parfois justifié ?",
        "Peut-on faire le mal en croyant faire le bien ?",
        "Faut-il juger une action sur ses intentions ou sur ses conséquences ?",
        "Pourquoi devrions-nous être justes quand personne ne nous voit ?"]}]},
    {n:"La connaissance", d:"Ce que nous pouvons savoir, croire et comprendre.", s:[
      {n:"Vérité et réalité", q:[
        "Existe-t-il une vérité absolue ?",
        "Peut-on être certain que le monde est tel que nous le percevons ?",
        "Nos sens nous trompent-ils plus qu’ils ne nous renseignent ?",
        "Une vérité douloureuse vaut-elle mieux qu’un mensonge réconfortant ?",
        "La science peut-elle tout expliquer ?"]},
      {n:"Raison et croyance", q:[
        "Peut-on croire sans preuve ?",
        "La raison suffit-elle pour bien vivre ?",
        "Doute-t-on trop ou pas assez aujourd’hui ?",
        "Les émotions sont-elles un obstacle à la pensée juste ?",
        "Que signifie vraiment « comprendre » quelque chose ?"]}]}
  ];
  var AMORCES = ["Je crois que…", "Au fond…", "Un exemple qui m’a marqué :", "Je ne suis pas d’accord, parce que…"];

  var scene = document.getElementById("scene"), body = document.body, lueur = document.getElementById("lueur");

  /* Mémoire locale (brouillons et questions déjà répondues) */
  function lire(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function noter(k, v){ try{ if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){} }

  /* Menu latéral */
  var nav = document.getElementById("navThemes");
  nav.innerHTML = T.map(function(t, i){
    return '<details><summary>' + t.n + '</summary>' +
      t.s.map(function(s, j){ return '<a href="#t' + i + '-s' + j + '">' + s.n + '</a>'; }).join("") + '</details>';
  }).join("");
  var btn = document.getElementById("btnMenu");
  function menu(ouvre){
    body.classList.toggle("ouvert", ouvre);
    btn.setAttribute("aria-expanded", ouvre);
    if(ouvre){ document.getElementById("fermer").focus(); }
    else if(document.activeElement && document.activeElement.closest && document.activeElement.closest("#tiroir")){ btn.focus(); }
  }
  btn.addEventListener("click", function(){ menu(!body.classList.contains("ouvert")); });
  document.getElementById("fermer").addEventListener("click", function(){ menu(false); });
  document.getElementById("voile").addEventListener("click", function(){ menu(false); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") menu(false); });

  /* Halo lumineux qui suit le doigt ou la souris sur les dossiers */
  document.addEventListener("pointermove", function(e){
    var d = e.target.closest && e.target.closest(".dossier");
    if(!d) return;
    var r = d.getBoundingClientRect();
    d.style.setProperty("--mx", (e.clientX - r.left) + "px");
    d.style.setProperty("--my", (e.clientY - r.top) + "px");
  });

  /* Question du jour */
  var plat = [];
  T.forEach(function(t, i){ t.s.forEach(function(s, j){ s.q.forEach(function(q, k){ plat.push({id:"t"+i+"-s"+j+"-q"+k, q:q}); }); }); });
  var jour = plat[Math.floor(Date.now() / 864e5) % plat.length];

  function fil(parts){
    return '<nav class="fil" aria-label="Fil d’Ariane">' + parts.map(function(p){
      return p.h ? '<a href="' + p.h + '">' + p.l + '</a>' : '<b>' + p.l + '</b>';
    }).join('<span>/</span>') + '</nav>';
  }

  function afficher(){
    var m = /^#t(\d+)(?:-s(\d+))?(?:-q(\d+))?$/.exec(location.hash);
    var t = m ? T[+m[1]] : null, s = t && m[2] !== undefined ? t.s[+m[2]] : null, q = s && m[3] !== undefined ? s.q[+m[3]] : null;
    var h = "";
    lueur.style.setProperty("--e", 0);
    if(!t){
      h = '<div class="vue"><span class="etiquette">Questions philosophiques</span>' +
        '<h1>Pense.<br><em>Réponds.</em><br>Partage.</h1>' +
        '<p class="intro">40 questions, 8 dossiers, et une page noire qui n’attend que tes mots. Écris autant que tu veux, il n’y a pas de mauvaise réponse.</p>' +
        '<div class="jour"><span class="etiquette">Question du jour</span><p>' + jour.q + '</p><a class="cta" href="#' + jour.id + '">Écrire ma réponse →</a></div>' +
        '<h2 class="titre-section">Choisis un thème</h2>' +
        '<div class="grille">' + T.map(function(x, i){
          return '<a class="dossier" href="#t' + i + '"><span class="num">THÈME 0' + (i+1) + '</span><h3>' + x.n + '</h3><p>' + x.d + '</p><span class="compte">' + x.s.length + ' sous-thèmes · ' + x.s.length*5 + ' questions</span></a>';
        }).join("") + '</div></div>';
    } else if(!s){
      h = '<div class="vue">' + fil([{l:"Accueil",h:"#"},{l:t.n}]) + '<h1>' + t.n + '</h1><p class="intro">' + t.d + '</p><div class="grille">' +
        t.s.map(function(x, j){
          var fait = 0; for(var k = 0; k < 5; k++){ if(lire("fait:t" + m[1] + "-s" + j + "-q" + k)) fait++; }
          return '<a class="dossier" href="#t' + m[1] + '-s' + j + '"><span class="num">DOSSIER 0' + (j+1) + '</span><h3>' + x.n + '</h3><span class="compte">5 questions' + (fait ? ' · ' + fait + ' répondue' + (fait > 1 ? 's' : '') : '') + '</span></a>';
        }).join("") + '</div></div>';
    } else if(q === null){
      h = '<div class="vue">' + fil([{l:"Accueil",h:"#"},{l:t.n,h:"#t"+m[1]},{l:s.n}]) + '<h1>' + s.n + '</h1><p class="intro">Choisis la question qui te parle le plus et écris ce qui te vient.</p><ol class="questions">' +
        s.q.map(function(x, k){
          var id = "t" + m[1] + "-s" + m[2] + "-q" + k;
          return '<li><a href="#' + id + '"><span class="n">' + (k+1) + '</span><span class="t">' + x + '</span>' + (lire("fait:" + id) ? '<span class="ok">✓ Répondu</span>' : '') + '</a></li>';
        }).join("") + '</ol></div>';
    } else {
      var k = +m[3], base = "#t" + m[1] + "-s" + m[2];
      var suiv = k < 4 ? '<a href="' + base + '-q' + (k+1) + '">Question suivante →</a>' : "";
      h = '<div class="vue">' + fil([{l:"Accueil",h:"#"},{l:t.n,h:"#t"+m[1]},{l:s.n,h:base},{l:"Question " + (k+1)}]) +
        '<span class="etiquette">' + t.n + ' · ' + s.n + '</span><h1 class="q">' + q + '</h1>' +
        '<form id="form" novalidate>' +
        '<div class="feuille"><textarea id="rep" name="reponse" aria-label="Ta réponse" placeholder="Commence par la première chose qui te vient à l’esprit…" required></textarea>' +
        '<div class="pied-feuille"><span id="compte">0 mot</span><span id="sauve"></span></div></div>' +
        '<div class="amorces"><span>Pas d’inspiration ?</span>' + AMORCES.map(function(a){ return '<button type="button" class="amorce">' + a + '</button>'; }).join("") + '</div>' +
        '<details class="signe"><summary>Signer ma réponse (facultatif)</summary><div class="deux">' +
        '<div><label for="prenom">Ton prénom</label><input type="text" id="prenom" name="prenom" autocomplete="given-name"></div>' +
        '<div><label for="mail">Ton email</label><input type="email" id="mail" name="email" autocomplete="email"></div></div></details>' +
        '<input type="text" name="_honey" class="piege" tabindex="-1" autocomplete="off" aria-hidden="true">' +
        '<button class="envoyer" type="submit">Envoyer ma réponse</button>' +
        '<p class="etat" id="etat" role="status"></p>' +
        '<p class="note">Ta réponse est envoyée par email à l’auteur du site. Ne mets pas d’informations trop personnelles.</p>' +
        '<div class="suite"><a href="' + base + '">← Toutes les questions</a>' + suiv + '</div></form></div>';
    }
    scene.innerHTML = h;
    window.scrollTo(0, 0);
    document.title = (q || (s && s.n) || (t && t.n) || "Questions philosophiques") + " · Philosophie";
    if(q){ branche(t.n, s.n, q, "t" + m[1] + "-s" + m[2] + "-q" + m[3]); }
  }

  /* Espace d'écriture : compteur, brouillon, envoi par email */
  function branche(theme, sous, question, id){
    var f = document.getElementById("form"), etat = document.getElementById("etat"),
        ta = document.getElementById("rep"), compte = document.getElementById("compte"), sauve = document.getElementById("sauve"), tmr;

    function maj(){
      var v = ta.value.trim(), mots = v ? v.split(/\s+/).length : 0;
      compte.textContent = mots + (mots > 1 ? " mots" : " mot");
      lueur.style.setProperty("--e", Math.min(mots / 60, 1));
    }
    var brouillon = lire("brouillon:" + id);
    if(brouillon){ ta.value = brouillon; sauve.textContent = "Brouillon retrouvé"; }
    maj();
    ta.addEventListener("input", function(){
      maj(); sauve.textContent = "";
      clearTimeout(tmr);
      tmr = setTimeout(function(){ noter("brouillon:" + id, ta.value.trim() ? ta.value : null); sauve.textContent = ta.value.trim() ? "Brouillon enregistré" : ""; }, 500);
    });

    scene.querySelectorAll(".amorce").forEach(function(b){
      b.addEventListener("click", function(){
        var txt = b.textContent + " ", pos = ta.selectionStart;
        var avant = ta.value.slice(0, pos), besoin = avant && !/\s$/.test(avant) ? "\n" : "";
        ta.setRangeText(besoin + txt, pos, ta.selectionEnd, "end");
        ta.focus(); ta.dispatchEvent(new Event("input"));
      });
    });

    f.addEventListener("submit", function(e){
      e.preventDefault();
      var rep = ta.value.trim();
      etat.className = "etat";
      if(!rep){ etat.className = "etat err"; etat.textContent = "Écris ta réponse avant de l’envoyer."; ta.focus(); return; }
      var b = f.querySelector(".envoyer"); b.disabled = true; etat.textContent = "Envoi en cours…";
      var data = {
        _subject: "Réponse philosophique : " + question,
        _template: "table", _captcha: "false", _honey: f._honey.value,
        theme: theme, sous_theme: sous, question: question, reponse: rep,
        prenom: f.prenom.value.trim() || "(anonyme)", email: f.email.value.trim() || "(non donné)"
      };
      if(f.email.value.trim()) data._replyto = f.email.value.trim();
      fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(data)})
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(j && (j.success === true || j.success === "true")){
            etat.className = "etat ok"; etat.textContent = "Merci de ta réponse ✦";
            noter("fait:" + id, "1"); noter("brouillon:" + id, null);
            ta.value = ""; sauve.textContent = ""; maj();
          } else { throw new Error("refus"); }
        })
        .catch(function(){
          etat.className = "etat err";
          etat.textContent = "L’envoi a échoué. Ta réponse est toujours dans la case : copie-la, puis réessaie dans un moment.";
        })
        .then(function(){ b.disabled = false; });
    });
  }

  window.addEventListener("hashchange", function(){ menu(false); afficher(); });
  afficher();
})();
</script>
